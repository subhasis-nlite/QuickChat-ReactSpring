spring.application.name=quickchat
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/quickchat
spring.datasource.username=quickchat
spring.datasource.password=quickchat

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

#app.jwt.secret=please-change-this-to-a-long-random-string-32chars-min
app.jwt.secret=quickchat-dev-secret-please-change-this-very-soon-123456

management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always
management.endpoint.mappings.enabled=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true